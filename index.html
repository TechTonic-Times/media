<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="https://techtonic-times.github.io/media/media-favicon.png" />
  <title>Riad's Drama-Anime Library</title>
  <style>
    /* ----- reset & variables ----- */
    * { box-sizing: border-box; margin: 0; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px Inter, ui-sans-serif, system-ui, sans-serif; }

    :root {
      --teal: #0d9488; --teal2: #14b8a6; --bg: #f6faf9; --card: #fff;
      --text: #12302f; --muted: #718381; --line: #dce9e7; --soft: #e8f5f3;
      --shadow: 0 12px 35px #0f766e12;
    }
    [data-theme="dark"] {
      --bg: #0d1718; --card: #142324; --text: #e7f5f3; --muted: #8da8a5;
      --line: #294240; --soft: #183432; --shadow: 0 12px 35px #0005;
    }

    body, .card, .modal, input, select, textarea, button, .stat, .filterGroup {
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    header { padding: 25px max(18px, calc((100% - 1400px)/2)); background: linear-gradient(135deg, var(--card), var(--soft)); border-bottom: 1px solid var(--line); }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--teal); color: white; display: grid; place-items: center; font-size: 24px; box-shadow: 0 7px 16px #0d948833; overflow: hidden; }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    .eyebrow { color: var(--teal); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 11px; }
    .brand h1 { font-size: clamp(20px, 3vw, 30px); margin: 2px 0; }
    .actions { display: flex; gap: 8px; }

    .iconbtn, .ghost, .primary, .filters select, .filters button, .filterGroup select, .tab {
      border: none;
    }
    .iconbtn, .ghost { background: var(--soft); color: var(--text); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    .iconbtn:hover, .ghost:hover { background: var(--line); color: var(--teal); }
    .primary { background: var(--teal); color: #fff; padding: 10px 18px; border-radius: 12px; font-weight: 800; cursor: pointer; }
    .primary:hover { background: var(--teal2); box-shadow: 0 4px 12px #0d948844; }

    .filterGroup { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 13px; background: var(--soft); flex-wrap: wrap; }
    .filterGroup span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--teal); font-weight: 800; margin: 0 3px; }
    .filterGroup select { background: var(--card); color: var(--text); padding: 9px; border-radius: 9px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

    .data-actions { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }

    /* grid / list */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }

    /* ---- CARD with POSTER (floated right) ---- */
    .card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: var(--shadow);
      transition: .2s;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .card:hover { transform: translateY(-3px); }

    .poster-wrapper {
      float: right;
      margin-left: 14px;
      margin-bottom: 6px;
      max-width: 38%;
    }

    .poster {
      width: 100px;
      max-width: 100%;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.13);
      background: transparent;
      object-fit: cover;
      display: block;
    }
    .poster:not([src]), .poster[src=""], .poster[src*="error"] {
      box-shadow: none;
      opacity: 0;
      width: 0;
      height: 0;
      display: none;
      float: none;
    }

    .body {
      flex: 1;
      overflow: hidden;
    }

    .title {
      font-size: 22px;
      font-weight: 850;
      color: var(--text);
      letter-spacing: -0.3px;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .meta {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      clear: none;
    }
    .badge {
      background: var(--soft);
      color: var(--teal);
      border-radius: 20px;
      padding: 4px 8px;
      font-weight: 700;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 8px 0 8px 0;
    }
    .chip {
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 7px;
      background: var(--soft);
    }
    .note {
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
      margin: 6px 0 12px 0;
    }

    /* cardfoot: horizontal by default, like mobile */
    .cardfoot {
      display: flex;
      gap: 6px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      flex-wrap: wrap;
      clear: both;
    }
    .cardfoot button {
      flex: 1 0 auto;
      background: transparent;
      color: var(--muted);
      padding: 6px 8px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }
    .cardfoot button:hover {
      background: var(--soft);
      color: var(--teal);
    }

    /* listview override — keep buttons horizontal */
    .listview .grid { display: flex; flex-direction: column; gap: 18px; }
    .listview .card { flex-direction: row; align-items: stretch; padding: 16px; }
    .listview .body { width: 100%; overflow: hidden; }
    .listview .cardfoot { border-top: none; border-left: 1px solid var(--line); padding-left: 15px; margin-left: auto; flex-direction: row; justify-content: center; min-width: 120px; clear: none; flex-wrap: wrap; }
    .listview .poster-wrapper { float: right; margin-left: 14px; max-width: 30%; }
    .listview .poster { width: 90px; }

    .tabs { max-width: 1400px; margin: 20px auto 0; padding: 5px; background: var(--line); border-radius: 15px; display: flex; }
    .tab { width: 50%; padding: 14px; border-radius: 11px; background: transparent; color: var(--muted); font-weight: 800; letter-spacing: .07em; cursor: pointer; border: none; }
    .tab.active { background: var(--card); color: var(--teal); box-shadow: var(--shadow); }

    main { max-width: 1400px; margin: auto; padding: 22px 18px 70px; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .search { flex: 1; min-width: 220px; position: relative; }
    .search input { width: 100%; padding: 14px 16px 14px 43px; border-radius: 13px; border: 1px solid var(--line); background: var(--card); color: var(--text); outline: 0; }
    .search input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px #14b8a633; }
    .search span { position: absolute; left: 15px; top: 12px; font-size: 20px; }

    .stats-container { margin: 18px 0; }
    #statsHeader { background: var(--card); border-radius: 12px; padding: 12px 18px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; font-weight: 700; color: var(--teal); }
    #statsHeader:hover { background: var(--soft); }
    #statsArrow { transition: transform 0.3s ease; }
    #stats.open #statsArrow { transform: rotate(180deg); }
    #stats { display: none; gap: 10px; flex-wrap: wrap; margin-top: 10px; opacity: 0; transform: translateY(-10px); transition: opacity 0.3s ease, transform 0.3s ease; }
    #stats.show { display: flex; opacity: 1; transform: translateY(0); }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; box-shadow: var(--shadow); }
    .stat b { display: block; font-size: 19px; color: var(--teal); }
    .stat small { color: var(--muted); }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 20px; }
    .filters select, .filters button { padding: 10px; border-radius: 10px; background: var(--card); color: var(--text); box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: none; }
    .filters .clear { color: var(--teal); font-weight: 700; cursor: pointer; }

    .modalback { position: fixed; inset: 0; background: #062a2a88; display: none; place-items: center; padding: 15px; z-index: 5; }
    .modalback.open { display: grid; }
    .modal { width: min(650px, 100%); max-height: 92vh; overflow: auto; background: var(--card); border-radius: 20px; padding: 22px; box-shadow: 0 20px 70px #0005; }
    .modal h2 { margin-top: 0; }
    .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1/-1; }
    .field label { font-size: 12px; font-weight: 800; color: var(--muted); }
    .field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: var(--bg); color: var(--text); }
    .modalactions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    .suggest { position: absolute; z-index: 2; top: 51px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
    .suggest div { padding: 10px; cursor: pointer; }
    .suggest div:hover { background: var(--soft); }

    .toast { position: fixed; right: 18px; bottom: 18px; background: #12302f; color: #fff; padding: 13px 17px; border-radius: 11px; z-index: 9; animation: pop .2s; }
    @keyframes pop { from { transform: translateY(10px); opacity: 0; } }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 25px; flex-wrap: wrap; }
    .pagination button { padding: 8px 16px; border-radius: 10px; border: none; background: var(--soft); color: var(--text); font-weight: 700; cursor: pointer; }
    .pagination button.active { background: var(--teal); color: #fff; }
    .pagination button:disabled { opacity: 0.4; pointer-events: none; }

    .field.poster-field input { font-size: 13px; }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr !important; }
      .listview .card { flex-direction: column; }
      .listview .cardfoot { border-left: none; border-top: 1px solid var(--line); padding-left: 0; padding-top: 10px; flex-direction: row; margin-left: 0; min-width: auto; }
      .listview .poster-wrapper { float: right; max-width: 35%; }
      .listview .poster { width: 70px; }
      .filters { display: grid; grid-template-columns: 1fr; }
      .filterGroup { flex-wrap: wrap; }
      .filterGroup select { flex: 1; min-width: 110px; }
      .head { align-items: flex-start; }
      .brand h1 { font-size: 19px; }
      .formgrid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .title { font-size: 19px; }
      .poster { width: 70px; }
      .poster-wrapper { margin-left: 10px; }
    }
  </style>
</head>
<body>
<header>
  <div class="head">
    <div class="brand">
      <div class="logo"><img src="https://techtonic-times.github.io/media/media-logo.png" alt="logo"></div>
      <div><div class="eyebrow">Personal media sanctuary</div><h1>Riad's Drama-Anime Library</h1></div>
    </div>
    <div class="actions">
      <button class="iconbtn" id="theme" aria-label="Change theme"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v2m0 14v2M5.6 5.6 7 7m10 10 1.4 1.4M3 12h2m14 0h2M5.6 18.4 7 17m10-10 1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg></button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-kind="drama">DRAMA</button>
    <button class="tab" data-kind="anime">ANIME</button>
  </div>
</header>

<main>
  <section class="toolbar">
    <div class="data-actions">
      <button class="ghost" id="exportBtn">Export</button>
      <button class="ghost" id="importBtn">Import</button>
      <button class="ghost" id="recoveryBtn">Recovery</button>
      <button class="ghost" id="gridView">Grid</button>
      <button class="ghost" id="listView">List</button>
    </div>
    <div class="search">
      <span>⌕</span>
      <input id="search" placeholder="Search dramas..." autocomplete="off">
      <div id="suggest" class="suggest" hidden></div>
    </div>
    <button class="primary" id="add">+ Add Drama</button>
  </section>

  <div class="stats-container">
    <div id="statsHeader"><span>Show Statistics</span><span id="statsArrow">▼</span></div>
    <div id="stats" class="stats"></div>
  </div>

  <div class="filters">
    <div class="filterGroup"><span>Progress</span>
      <select id="status"><option value="">All Statuses</option><option>Wishlist</option><option>Finished</option><option>On Hold</option><option>Dropped</option></select>
      <select id="love"><option value="">All Love</option><option value="yes">Loved</option><option value="no">Not Loved</option></select>
    </div>
    <div class="filterGroup"><span>Details</span>
      <select id="rating"><option value="">All Ratings</option><option value="9">9+</option><option value="8">8+</option><option value="7">7+</option><option value="6">6+</option><option value="5">5+</option><option value="unrated">Unrated</option></select>
      <select id="genre"><option value="">All Genres</option></select>
      <select id="year"><option value="">All Years</option></select>
      <select id="finished"><option value="">Finished Year</option></select>
    </div>
    <div class="filterGroup"><span>Arrange</span>
      <select id="sort">
        <option value="recent">Recently Finished</option>
        <option value="new">Newest First</option>
        <option value="old">Oldest First</option>
        <option value="az">Title A–Z</option>
        <option value="za">Title Z–A</option>
        <option value="high">Highest Rated</option>
        <option value="low">Lowest Rated</option>
      </select>
    </div>
    <button class="clear" id="clear">Clear Filters</button>
  </div>

  <div id="grid" class="grid"></div>

  <div class="pagination" id="pagination"></div>
</main>

<!-- modal -->
<div id="modalback" class="modalback">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modalTitle">Add Drama</h2>
    <form id="form">
      <input type="hidden" id="editId">
      <div class="formgrid">
        <div class="field full"><label>Title *</label><input id="title" required autocomplete="off"><div id="modalSuggest" class="suggest" hidden></div></div>
        <div class="field poster-field"><label>Poster URL</label><input id="mposter" placeholder="https://example.com/poster.jpg"></div>
        <div class="field"><label>Status</label><select id="mstatus"><option>Wishlist</option><option>Finished</option><option>On Hold</option><option>Dropped</option></select></div>
        <div class="field"><label>Rating (0–10)</label><input id="mrating" type="number" min="0" max="10" step="any"></div>
        <div class="field"><label>Episodes Watched</label><input id="watched" type="number" min="0"></div>
        <div class="field"><label>Total Episodes</label><input id="total" type="number" min="0"></div>
        <div class="field"><label>Genres (comma)</label><input id="genres"></div>
        <div class="field"><label>Release Year</label><input id="myear" type="number"></div>
        <div class="field"><label>Language</label><select id="language"><option>Original Language</option><option>Hindi Dubbed</option><option>English Dubbed</option><option>Other</option></select></div>
        <div class="field"><label>Finished Date</label><input id="fdate" type="date"></div>
        <div class="field full"><label>Personal Note</label><textarea id="note" rows="3"></textarea></div>
      </div>
      <div class="modalactions">
        <button type="button" class="ghost" id="cancel">Cancel</button>
        <button class="primary">Save title</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<input type="file" id="import" accept="application/json" hidden>

<script>
  (function(){
    const $ = s => document.querySelector(s);
    const key = 'riad-library-';
    const state = {
      kind: localStorage.getItem(key+'lastTab') || 'drama',
      data: {
        anime: JSON.parse(localStorage.getItem(key+'anime') || '[]'),
        drama: JSON.parse(localStorage.getItem(key+'drama') || '[]')
      },
      media: [],
      page: 1,
      perPage: 50
    };
    let timer;

    const norm = s => (s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
    const makeId = title => norm(title).replace(/\s+/g, '-');

    function save() { localStorage.setItem(key+state.kind, JSON.stringify(state.data[state.kind])); }
    function toast(t) { const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(timer); timer=setTimeout(()=>el.hidden=true,2200); }
    function setTheme() {
      let t = state.theme === 'system' ? (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light') : state.theme;
      document.documentElement.dataset.theme = t;
    }
    function fmt(d) { return d ? new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : ''; }

    $('#statsHeader').onclick = () => {
      const s = $('#stats');
      s.classList.toggle('show');
      $('#statsHeader').parentElement.classList.toggle('open');
    };

    function render() {
      const arr = state.data[state.kind];
      const q = norm($('#search').value);
      const words = q.split(' ').filter(Boolean);

      let filtered = arr.filter(x => {
        const hay = norm(x.title + ' ' + (x.genres||[]).join(' '));
        return words.every(w => hay.includes(w))
          && (!$('#status').value || x.status === $('#status').value)
          && (!$('#love').value || (($('#love').value === 'yes') === !!x.loved))
          && (!$('#rating').value || ($('#rating').value === 'unrated' ? (x.rating===''||x.rating==null) : +x.rating >= +$('#rating').value))
          && (!$('#genre').value || (x.genres||[]).includes($('#genre').value))
          && (!$('#year').value || x.year == $('#year').value)
          && (!$('#finished').value || (x.finishedDate||'').startsWith($('#finished').value));
      });

      const sort = $('#sort').value;
      filtered.sort((a,b) => {
        if (sort === 'az') return a.title.localeCompare(b.title);
        if (sort === 'za') return b.title.localeCompare(a.title);
        if (sort === 'old') return a.addedAt - b.addedAt;
        if (sort === 'high') return (b.rating??-1) - (a.rating??-1);
        if (sort === 'low') return (a.rating??99) - (b.rating??99);
        if (sort === 'recent') return (b.finishedDate||'').localeCompare(a.finishedDate||'');
        return b.addedAt - a.addedAt;
      });

      const loved = arr.filter(x=>x.loved).length;
      const avgArr = arr.filter(x=>x.rating!=='' && x.rating!=null);
      $('#stats').innerHTML = [
        [''+arr.length, 'Total '+state.kind],
        [''+arr.filter(x=>x.status==='Finished').length, 'Finished'],
        [''+arr.filter(x=>x.status==='Wishlist').length, 'Wishlist'],
        [''+arr.filter(x=>x.status==='On Hold').length, 'On Hold'],
        [''+arr.filter(x=>x.status==='Dropped').length, 'Dropped'],
        ['❤️ '+loved, 'Loved'],
        ['⭐ '+(avgArr.length ? (avgArr.reduce((a,x)=>a+ +x.rating,0)/avgArr.length).toFixed(2) : '—'), 'Average Rating']
      ].map(x => `<div class=stat><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');

      const total = filtered.length;
      const totalPages = Math.max(1, Math.ceil(total / state.perPage));
      if (state.page > totalPages) state.page = totalPages;
      if (state.page < 1) state.page = 1;
      const start = (state.page - 1) * state.perPage;
      const pageItems = filtered.slice(start, start + state.perPage);

      const grid = $('#grid');
      if (!pageItems.length) {
        grid.innerHTML = `<div class=empty style="grid-column:1/-1; text-align:center; padding:70px 20px; color:var(--muted);">
          <strong>${q||$('#status').value?'No results found':'Your '+state.kind[0].toUpperCase()+state.kind.slice(1)+' Library is Empty'}</strong>
          <span>${q||$('#status').value?'Try another keyword or clear your filters.':'Start building your collection.'}</span><br><br>
          <button class=primary onclick="openModal()">+ Add ${state.kind[0].toUpperCase()+state.kind.slice(1)}</button>
        </div>`;
      } else {
        grid.innerHTML = pageItems.map(card).join('');
      }

      const pg = $('#pagination');
      let pgHTML = `<button onclick="goPage(1)" ${state.page===1?'disabled':''}>⏮</button>
                    <button onclick="goPage(${state.page-1})" ${state.page===1?'disabled':''}>◀</button>`;
      for (let i=1; i<=totalPages; i++) {
        pgHTML += `<button onclick="goPage(${i})" class="${i===state.page?'active':''}">${i}</button>`;
      }
      pgHTML += `<button onclick="goPage(${state.page+1})" ${state.page===totalPages?'disabled':''}>▶</button>
                 <button onclick="goPage(${totalPages})" ${state.page===totalPages?'disabled':''}>⏭</button>
                 <span style="margin-left:10px;color:var(--muted);font-size:13px;">${total} titles</span>`;
      pg.innerHTML = pgHTML;

      populateFilters();
    }

    function card(x) {
      const posterHtml = x.poster ? 
        `<div class="poster-wrapper"><img class="poster" src="${x.poster}" alt="${x.title} poster" loading="lazy" onerror="this.style.display='none';this.parentElement.style.display='none';" /></div>` : 
        '';
      return `<article class="card">
        <div class="body">
          ${posterHtml}
          <h3 class="title">${x.title}</h3>
          <div class="meta">
            <span class="badge">${x.status}</span>
            <span>${x.loved?'❤️':''}</span>
            <span>${x.rating!==''&&x.rating!=null?'⭐ '+x.rating+'/10':'☆ Unrated'}</span>
          </div>
          <div class="meta">▣ ${x.watched||0} / ${x.total||'?'} Episodes ${x.finishedDate?' · '+fmt(x.finishedDate):''}</div>
          <div class="meta">◉ ${x.language||'Original Language'}</div>
          <div class="chips">${(x.genres||[]).map(g=>`<span class="chip">${g}</span>`).join('')}</div>
          <div class="note">${x.note||'No personal note'}</div>
          <div class="cardfoot">
            <button onclick="copyTitle('${x.id}')">📋 Copy</button>
            <button onclick="toggleLove('${x.id}')">${x.loved?'❤️ Loved':'♡ Love'}</button>
            <button onclick="editTitle('${x.id}')">✏️ Edit</button>
            <button onclick="deleteTitle('${x.id}')">🗑️ Delete</button>
          </div>
        </div>
      </article>`;
    }

    function populateFilters() {
      const arr = state.data[state.kind];
      const opts = (a, sort=false) => [...new Set(a)].filter(Boolean).sort((a,b)=>sort?b-a:a.localeCompare(b));
      const gs = opts(arr.flatMap(x=>x.genres||[]));
      const ys = opts(arr.map(x=>x.year), true);
      const fs = opts(arr.map(x=>(x.finishedDate||'').slice(0,4)), true);
      [ ['genre', gs, 'All Genres'], ['year', ys, 'All Years'], ['finished', fs, 'Finished Year'] ].forEach(([id,a,ph]) => {
        const el = $('#'+id);
        const current = el.value;
        el.innerHTML = `<option value="">${ph}</option>` + a.map(v=>`<option>${v}</option>`).join('');
        el.value = current;
      });
    }

    window.goPage = function(p) {
      const total = state.data[state.kind].length;
      const max = Math.max(1, Math.ceil(total / state.perPage));
      if (p < 1) p = 1;
      if (p > max) p = max;
      state.page = p;
      render();
    };

    function openModal(x) {
      $('#form').reset();
      $('#editId').value = x?.id || '';
      $('#modalTitle').textContent = (x?'Edit ':'Add ') + state.kind[0].toUpperCase()+state.kind.slice(1);
      if (!x) { $('#mstatus').value = 'Finished'; }
      if (x) {
        ['title','mposter','mstatus','mrating','watched','total','genres','myear','language','fdate','note'].forEach((id,i) => {
          const k = ['title','poster','status','rating','watched','total','genres','year','language','finishedDate','note'][i];
          $('#'+id).value = Array.isArray(x[k]) ? x[k].join(', ') : (x[k]??'');
        });
      }
      $('#modalback').classList.add('open');
      $('#title').focus();
    }
    window.openModal = openModal;

    function closeModal() { $('#modalback').classList.remove('open'); }
    $('#cancel').onclick = closeModal;
    $('#modalback').onclick = e => { if (e.target.id === 'modalback') closeModal(); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // suggestions – we keep the logic but hide it on edit (modalSuggest hidden by default)
    function mediaSuggest(input, box) {
      // do not show suggestions when editing (if editId is set, we skip)
      if ($('#editId').value) {
        box.hidden = true;
        return;
      }
      const q = norm(input.value);
      box.innerHTML = state.media.filter(m => m.type.toLowerCase()===state.kind && q && norm(m.title+' '+(m.alternativeTitles||[]).join(' ')).split(' ').some(w=>w.includes(q)||q.includes(w))).slice(0,5).map(m => `<div data-title="${m.title}"><b>${m.title}</b> <small>${m.year||''} · ${(m.genres||[]).join(', ')}</small></div>`).join('');
      box.hidden = !box.innerHTML;
    }
    $('#title').oninput = () => mediaSuggest($('#title'), $('#modalSuggest'));
    $('#modalSuggest').onclick = e => {
      const m = state.media.find(x => x.title === e.target.closest('div')?.dataset.title);
      if (m) {
        $('#title').value = m.title;
        $('#genres').value = (m.genres||[]).join(', ');
        $('#myear').value = m.year||'';
        $('#total').value = m.episodes||'';
        $('#modalSuggest').hidden = true;
      }
    };

    $('#form').onsubmit = e => {
      e.preventDefault();
      const r = $('#mrating').value, w = +$('#watched').value||0, t = +$('#total').value||0;
      if (r !== '' && (r<0 || r>10)) return toast('⚠ Invalid rating');
      if (t && w > t) return toast('⚠ Invalid episode count');
      const title = $('#title').value.trim();
      if (!title) return;
      const id = makeId(title);
      const old = state.data[state.kind].find(x => x.id === id);
      const x = {
        id, title,
        poster: $('#mposter').value.trim() || '',
        status: $('#mstatus').value,
        loved: old?.loved || false,
        rating: r==='' ? '' : +r,
        watched: w,
        total: t,
        genres: $('#genres').value.split(',').map(s=>s.trim()).filter(Boolean),
        year: $('#myear').value ? +$('#myear').value : '',
        language: $('#language').value,
        finishedDate: $('#fdate').value,
        note: $('#note').value,
        addedAt: old?.addedAt || Date.now()
      };
      if (old) {
        state.data[state.kind] = state.data[state.kind].map(y => y.id===id ? x : y);
        toast('✓ Changes saved');
      } else {
        state.data[state.kind] = [...state.data[state.kind], x];
        toast('✓ '+state.kind[0].toUpperCase()+state.kind.slice(1)+' added');
      }
      save(); closeModal(); render();
    };

    window.toggleLove = id => {
      const x = state.data[state.kind].find(x=>x.id===id);
      if (x) { x.loved = !x.loved; save(); render(); toast(x.loved?'❤️ Loved':'♡ Love removed'); }
    };
    window.editTitle = id => {
      const item = state.data[state.kind].find(x=>x.id===id);
      if (!item) return;
      // clear suggestions when editing
      $('#modalSuggest').hidden = true;
      openModal(item);
    };
    window.deleteTitle = id => {
      const x = state.data[state.kind].find(x=>x.id===id);
      if (!x) return;
      if (confirm(`Delete “${x.title}”?`)) {
        const trash = JSON.parse(localStorage.getItem(key+'trash')||'[]');
        trash.push({...x, deletedFrom: state.kind, deletedAt: Date.now()});
        localStorage.setItem(key+'trash', JSON.stringify(trash));
        state.data[state.kind] = state.data[state.kind].filter(y => y.id !== id);
        save(); render();
        toast('Title moved to Recovery');
      }
    };
    window.copyTitle = async id => {
      const x = state.data[state.kind].find(x=>x.id===id);
      if (!x) return;
      try { await navigator.clipboard.writeText(x.title); } catch { 
        const a = document.createElement('textarea'); a.value=x.title; document.body.append(a); a.select(); document.execCommand('copy'); a.remove();
      }
      toast('✓ Title copied');
    };

    // tabs – remember last tab
    document.querySelectorAll('.tab').forEach(b => {
      b.onclick = () => {
        state.kind = b.dataset.kind;
        state.page = 1;
        localStorage.setItem(key+'lastTab', state.kind);
        document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x===b));
        $('#search').placeholder = 'Search '+state.kind+'s...';
        $('#add').textContent = '+ Add '+state.kind[0].toUpperCase()+state.kind.slice(1);
        render();
      };
    });

    ['search','status','love','rating','genre','year','finished','sort'].forEach(id => {
      $('#'+id).addEventListener('input', () => { state.page = 1; render(); });
    });

    $('#clear').onclick = () => {
      ['search','status','love','rating','genre','year','finished'].forEach(id => $('#'+id).value='');
      $('#sort').value = 'recent';
      state.page = 1; render();
    };
    $('#add').onclick = () => openModal();

    $('#exportBtn').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(state.data,null,2)], {type:'application/json'}));
      a.download = 'riad-library-backup.json'; a.click(); toast('Backup exported');
    };
    $('#importBtn').onclick = () => $('#import').click();
    $('#import').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const d = JSON.parse(reader.result);
          if (!d || !Array.isArray(d.anime) || !Array.isArray(d.drama)) throw 0;
          state.data = { anime: d.anime, drama: d.drama };
          localStorage.setItem(key+'anime', JSON.stringify(d.anime));
          localStorage.setItem(key+'drama', JSON.stringify(d.drama));
          state.page = 1; render(); toast('✓ Backup imported');
        } catch { toast('⚠ Invalid backup file'); }
      };
      reader.readAsText(file);
    };
    $('#recoveryBtn').onclick = () => {
      const all = JSON.parse(localStorage.getItem(key+'trash')||'[]');
      const now = Date.now();
      const valid = all.filter(x => now - x.deletedAt < 30*86400000);
      localStorage.setItem(key+'trash', JSON.stringify(valid));
      if (!valid.length) return toast('No recoverable titles');
      const names = valid.map((x,i) => `${i+1}. ${x.title} (${x.deletedFrom})`).join('\n');
      const n = prompt('Recover a title by number:\n\n'+names);
      const i = +n - 1, x = valid[i];
      if (x) {
        delete x.deletedAt; const dest = x.deletedFrom; delete x.deletedFrom;
        if (!state.data[dest].some(y=>y.id===x.id)) {
          state.data[dest].push(x);
          localStorage.setItem(key+dest, JSON.stringify(state.data[dest]));
          localStorage.setItem(key+'trash', JSON.stringify(valid.filter((_,j)=>j!==i)));
          state.page = 1; render(); toast('Title recovered');
        }
      }
    };

    // theme
    state.theme = localStorage.getItem(key+'theme') || 'system';
    setTheme();
    $('#theme').onclick = () => {
      state.theme = state.theme === 'light' ? 'dark' : state.theme === 'dark' ? 'system' : 'light';
      localStorage.setItem(key+'theme', state.theme);
      setTheme(); toast('✓ Theme changed');
    };

    function setView(mode) {
      const grid = $('#grid');
      if (mode === 'list') grid.classList.add('listview');
      else grid.classList.remove('listview');
      localStorage.setItem(key+'view', mode);
    }
    $('#gridView').onclick = () => setView('grid');
    $('#listView').onclick = () => setView('list');
    const savedView = localStorage.getItem(key+'view') || 'grid';
    setView(savedView);

    // embedded data
    const embeddedData = [
      { title: "Solo Leveling Season 1", type: "Anime", genres: ["Action","Fantasy"], year: 2024, rating: 9.5, episodes: 12, alternativeTitles: [], poster: "https://i.mydramalist.com/O8PDKb_4f.jpg" },
      { title: "Solo Leveling Season 2", type: "Anime", genres: ["Action","Fantasy"], year: 2025, rating: 9.7, episodes: 13, alternativeTitles: [], poster: "https://i.mydramalist.com/O8PDKb_4f.jpg" },
      { title: "Sakamoto Days Part 1", type: "Anime", genres: ["Action","Comedy"], year: 2025, rating: 9.5, episodes: 12, alternativeTitles: [], poster: "https://i.mydramalist.com/O8PDKb_4f.jpg" },
      { title: "Kaiju Number 8 Season 1", type: "Anime", genres: ["Action","Sci-Fi"], year: 2024, rating: 9.5, episodes: 12, alternativeTitles: [], poster: "https://i.mydramalist.com/O8PDKb_4f.jpg" },
      { title: "An Archdemon's Dilemma", type: "Anime", genres: ["Fantasy","Romance"], year: 2024, rating: 9.8, episodes: 12, alternativeTitles: [], poster: "https://i.mydramalist.com/O8PDKb_4f.jpg" },
      { title: "Crash Landing on You", type: "Drama", genres: ["Romance","Comedy","Drama"], year: 2019, rating: 9.7, episodes: 16, alternativeTitles: ["CLOY"], poster: "https://i.mydramalist.com/O8PDKb_4f.jpg" },
      { title: "Goblin", type: "Drama", genres: ["Romance","Fantasy"], year: 2016, rating: 9.9, episodes: 16, alternativeTitles: ["Guardian: The Lonely and Great God"], poster: "https://i.mydramalist.com/O8PDKb_4f.jpg" },
      { title: "Vincenzo", type: "Drama", genres: ["Action","Comedy","Drama"], year: 2021, rating: 9.9, episodes: 20, alternativeTitles: [], poster: "https://i.mydramalist.com/O8PDKb_4f.jpg" },
      { title: "Business Proposal", type: "Drama", genres: ["Romance","Comedy"], year: 2022, rating: 9.8, episodes: 12, alternativeTitles: [], poster: "https://i.mydramalist.com/O8PDKb_4f.jpg" },
      { title: "Queen of Tears", type: "Drama", genres: ["Romance","Drama"], year: 2024, rating: 9.7, episodes: 16, alternativeTitles: [], poster: "https://i.mydramalist.com/O8PDKb_4f.jpg" }
    ];
    state.media = embeddedData;

    // set default sort to 'recent'
    $('#sort').value = 'recent';

    // set active tab from saved state
    document.querySelectorAll('.tab').forEach(b => {
      b.classList.toggle('active', b.dataset.kind === state.kind);
    });
    $('#search').placeholder = 'Search '+state.kind+'s...';
    $('#add').textContent = '+ Add '+state.kind[0].toUpperCase()+state.kind.slice(1);

    state.page = 1;
    render();
  })();
</script>
</body>
</html>
